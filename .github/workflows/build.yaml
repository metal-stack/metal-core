---
name: metal-stack component release

on:
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  push:
    branches:
      - master

jobs:
  draft:
    uses: metal-stack/actions-common/.github/workflows/release-drafter.yaml@v1

  go-build:
    uses: metal-stack/actions-common/.github/workflows/go-build.yaml@lint-args
    secrets: inherit
    with:
      build-command: make ci-build
      lint-args: --build-tags client
