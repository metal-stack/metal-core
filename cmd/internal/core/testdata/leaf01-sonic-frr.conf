! The frr version is not rendered since it seems to be optional.
frr defaults datacenter
hostname leaf01
password zebra
enable password zebra
!
agentx
log syslog warnings
log facility local4
debug bgp updates
debug bgp nht
debug bgp update-groups
debug bgp zebra
debug zebra events
debug zebra nexthop detail
debug zebra rib detailed
debug zebra nht detailed
!
vrf Vrf100
 vni 100
 exit-vrf
!
vrf Vrf200
 vni 200
 exit-vrf
!
interface Ethernet120
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
interface Ethernet124
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
interface Ethernet4
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
interface Ethernet6 vrf Vrf100
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
interface Ethernet5 vrf Vrf200
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
router bgp 42
 bgp router-id 10.1.1.1
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor Ethernet120 interface peer-group FABRIC
 neighbor Ethernet124 interface peer-group FABRIC
 neighbor FIREWALL peer-group
 neighbor FIREWALL remote-as external
 neighbor FIREWALL timers 2 8
 neighbor Ethernet4 interface peer-group FIREWALL
 !
 address-family ipv4 unicast
  redistribute connected route-map DENY_MGMT
  redistribute kernel route-map DENY_MGMT
  neighbor FIREWALL allowas-in 2
  neighbor Ethernet4 route-map fw-Ethernet4-in in
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected route-map DENY_MGMT
  redistribute kernel route-map DENY_MGMT
  neighbor FIREWALL allowas-in 2
  # see https://docs.frrouting.org/en/latest/bgp.html#clicmd-neighbor-A.B.C.D-activate
  # why activate is required
  neighbor FIREWALL activate
  neighbor Ethernet4 route-map fw-Ethernet4-in in
 exit-address-family
 !
 address-family l2vpn evpn
  advertise-all-vni
  neighbor FABRIC activate
  neighbor FABRIC allowas-in 2
  neighbor FIREWALL activate
  neighbor FIREWALL allowas-in 2
  neighbor Ethernet4 route-map fw-Ethernet4-vni out
 exit-address-family
!
route-map DENY_MGMT deny 10
  match interface eth0
route-map DENY_MGMT permit 20
!
# route-maps for firewall@Ethernet4
ip prefix-list fw-Ethernet4-in-prefixes permit 10.32.24.0/24 le 32
route-map fw-Ethernet4-in permit 10
 match ip address prefix-list fw-Ethernet4-in-prefixes
route-map fw-Ethernet4-vni permit 10
 match evpn vni 104009
route-map fw-Ethernet4-vni permit 11
 match evpn vni 200
!
!
router bgp 42 vrf Vrf100
 bgp router-id 10.1.1.1
 bgp bestpath as-path multipath-relax
 neighbor MACHINE peer-group
 neighbor MACHINE remote-as external
 neighbor MACHINE timers 2 8
 neighbor Ethernet6 interface peer-group MACHINE
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor MACHINE maximum-prefix 24000
  neighbor MACHINE route-map Vrf100-in in
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
# route-maps for Vrf100
ip prefix-list Vrf100-in-prefixes permit 10.32.25.0/24 le 32
route-map Vrf100-in permit 10
 match ip address prefix-list Vrf100-in-prefixes
!
router bgp 42 vrf Vrf200
 bgp router-id 10.1.1.1
 bgp bestpath as-path multipath-relax
 neighbor MACHINE peer-group
 neighbor MACHINE remote-as external
 neighbor MACHINE timers 2 8
 neighbor Ethernet5 interface peer-group MACHINE
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor MACHINE maximum-prefix 24000
  neighbor MACHINE route-map Vrf200-in in
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
# route-maps for Vrf200
ip prefix-list Vrf200-in-prefixes permit 10.32.24.0/24 le 32
route-map Vrf200-in permit 10
 match ip address prefix-list Vrf200-in-prefixes
!
route-map RM_SET_SRC permit 10
 set src 10.1.1.1
exit
!
ip protocol bgp route-map RM_SET_SRC
!
line vty
!
