! The frr version is not rendered since it seems to be optional.
frr defaults datacenter
hostname cumulus-leaf02
username cumulus nopassword
service integrated-vtysh-config
!
log syslog warnings
debug bgp updates
debug bgp nht
debug bgp update-groups
debug bgp zebra
!
vrf vrf100
 vni 100
 exit-vrf
!
vrf vrf200
 vni 200
 exit-vrf
!
vrf vrf300
 vni 300
 exit-vrf
!
interface swp5
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
interface swp6 vrf vrf200
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
interface swp7 vrf vrf100
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
interface swp8 vrf vrf300
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
interface swp9 vrf vrf100
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
interface swp31
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
interface swp32
 ipv6 nd ra-interval 6
 no ipv6 nd suppress-ra
!
router bgp 42
 bgp router-id 10.1.1.1
 bgp bestpath as-path multipath-relax
 neighbor FABRIC peer-group
 neighbor FABRIC remote-as external
 neighbor FABRIC timers 2 8
 neighbor FIREWALL peer-group
 neighbor FIREWALL remote-as external
 neighbor FIREWALL timers 2 8
 neighbor swp31 interface peer-group FABRIC
 neighbor swp32 interface peer-group FABRIC
 neighbor swp5 interface peer-group FIREWALL
 !
 address-family ipv4 unicast
  redistribute connected route-map LOOPBACKS
  redistribute kernel route-map LOOPBACKS
  neighbor FIREWALL allowas-in 2
  neighbor swp5 route-map fw-swp5-in in
 exit-address-family
 !
 address-family ipv6 unicast
  redistribute connected route-map LOOPBACKS
  redistribute kernel route-map LOOPBACKS
  neighbor FIREWALL activate
  neighbor FIREWALL allowas-in 2
  neighbor swp5 route-map fw-swp5-in in
 exit-address-family
 !
 address-family l2vpn evpn
  advertise-all-vni
  neighbor FABRIC activate
  neighbor FABRIC allowas-in 2
  neighbor FIREWALL activate
  neighbor FIREWALL allowas-in 2
  neighbor swp5 route-map fw-swp5-vni out
 exit-address-family
!
router bgp 42 vrf vrf100
 bgp router-id 10.1.1.1
 bgp bestpath as-path multipath-relax
 neighbor EXTERNAL peer-group
 neighbor EXTERNAL ebgp-multihop 2
 neighbor MACHINE peer-group
 neighbor MACHINE remote-as external
 neighbor MACHINE timers 2 8
 neighbor swp9 interface peer-group EXTERNAL
 neighbor swp7 interface peer-group MACHINE
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor EXTERNAL route-map vrf100-in in
  neighbor MACHINE maximum-prefix 24000
  neighbor MACHINE route-map vrf100-in in
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
router bgp 42 vrf vrf200
 bgp router-id 10.1.1.1
 bgp bestpath as-path multipath-relax
 neighbor MACHINE peer-group
 neighbor MACHINE remote-as external
 neighbor MACHINE timers 2 8
 neighbor swp6 interface peer-group MACHINE
 !
 address-family ipv4 unicast
  redistribute connected
  neighbor MACHINE maximum-prefix 24000
  neighbor MACHINE route-map vrf200-in in
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
 exit-address-family
!
ip prefix-list fw-swp5-in-prefixes permit 10.32.24.0/24 le 32
ip prefix-list vrf100-in-prefixes permit 10.32.25.0/24 le 32
ip prefix-list vrf200-in-prefixes permit 10.32.24.0/24 le 32
ip prefix-list vrf300-in-prefixes permit 10.0.0.0/16 le 32
!
route-map LOOPBACKS permit 10
 match interface lo
route-map fw-swp5-in permit 10
 match ip address prefix-list fw-swp5-in-prefixes
route-map fw-swp5-vni permit 10
 match evpn vni 104009
route-map fw-swp5-vni permit 11
 match evpn vni 200
route-map vrf100-in permit 10
 match ip address prefix-list vrf100-in-prefixes
route-map vrf200-in permit 10
 match ip address prefix-list vrf200-in-prefixes
route-map vrf300-in permit 10
 match ip address prefix-list vrf300-in-prefixes
!
ip route 0.0.0.0/0 10.253.1.129/30 nexthop-vrf mgmt
ip route 10.100.0.0/16 10.253.1.129/30 nexthop-vrf mgmt
!
line vty
!
