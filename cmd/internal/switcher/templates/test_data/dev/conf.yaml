---
name: leaf01
loglevel: warnings
loopback: 10.0.0.10
setsrcloopback: true
asn: 4200000010
metalcorecidr: 10.255.255.2/24
pxevlanid: 966
ports:
  - name: swp1
    vrf: vrf104001
    mtu: 9000
  - name: swp2
    vrf: vrf104001
    mtu: 9000
  - name: swp3
    mtu: 9216
  - name: swp4
    mtu: 9000
    vlan: Vlan966
  - name: swp5
    mtu: 9000
    vlan: Vlan966
  - name: swp31
    mtu: 9216
  - name: swp32
    mtu: 9216
vrfs:
  - name: vrf104001
    vni: 104001
    vlanid: 1001
eth0:
  addresscidr: 192.168.101.12/24
  gateway: 192.168.101.1
additionalmgmtroutes:
  - 10.100.0.0/16
  - 10.200.0.0/16
frrconfig:
  vrfs:
    - vrf104001
  unnumberedinterfaces:
    - name: swp1
      vrf: vrf104001
    - name: swp2
      vrf: vrf104001
    - name: swp3
    - name: swp31
    - name: swp32
  bgps:
    - peergroups:
        - name: FABRIC
          commands:
            - remote-as external
            - timers 2 8
        - name: FIREWALL
          commands:
            - remote-as external
            - timers 2 8
      neighbors:
        - name: swp31 interface
          peergroup: FABRIC
        - name: swp32 interface
          peergroup: FABRIC
        - name: swp3 interface
          peergroup: FIREWALL
      addressfamilies:
        ipv4unicast:
          globalcommands:
            - redistribute connected route-map DENY_MGMT
            - redistribute kernel route-map DENY_MGMT
          neighbors:
            - name: FIREWALL
              commands:
                - allowas-in 2
            - name: swp3
              commands:
                - route-map fw-swp3-in in
        ipv6unicast:
          globalcommands:
            - redistribute connected route-map DENY_MGMT
            - redistribute kernel route-map DENY_MGMT
          neighbors:
            - name: FIREWALL
              commands:
                - allowas-in 2
                - activate
            - name: swp3
              commands:
                - route-map fw-swp3-in in
        l2vpnevpn:
          globalcommands:
            - advertise-all-vni
          neighbors:
            - name: FABRIC
              commands:
                - activate
                - allowas-in 2
            - name: FIREWALL
              commands:
                - activate
                - allowas-in 2
            - name: swp3
              commands:
                - route-map fw-swp3-vni out
    - vrf: vrf104001
      peergroups:
        - name: MACHINE
          commands:
            - remote-as external
            - timers 2 8
      neighbors:
        - name: swp1 interface
          peergroup: MACHINE
        - name: swp2 interface
          peergroup: MACHINE
      addressfamilies:
        ipv4unicast:
          globalcommands:
            - redistribute connected
          neighbors:
            - name: MACHINE
              commands:
                - maximum-prefix 24000
                - route-map vrf104001-in in
        ipv6unicast:
          globalcommands:
            - redistribute connected
          neighbors:
            - name: MACHINE
              commands:
                - maximum-prefix 24000
                - activate
                - route-map vrf104001-in6 in
        l2vpnevpn:
          globalcommands:
            - advertise ipv4 unicast
            - advertise ipv6 unicast
  routemaps:
    - name: DENY_MGMT
      entries:
        - match interface eth0
      policy: deny
      order: 10
    - name: DENY_MGMT
      policy: permit
      order: 20
    - name: fw-swp3-in
      entries:
        - match ip address prefix-list fw-swp3-in-prefixes
      policy: permit
      order: 10
    - name: fw-swp3-vni
      entries:
        - match evpn vni 104001
      policy: permit
      order: 10
    - name: fw-swp3-vni
      entries:
        - match evpn vni 104009
      policy: permit
      order: 11
    - name: fw-swp3-vni
      entries:
        - match evpn vni 104010
      policy: permit
      order: 12
    - name: vrf104001-in
      entries:
        - match ip address prefix-list vrf104001-in-prefixes
      policy: permit
      order: 10
    - name: vrf104001-in6
      entries:
        - match ipv6 address prefix-list vrf104001-in6-prefixes
      policy: permit
      order: 10
  prefixlists:
    - addressfamily: ip
      name: fw-swp3-in-prefixes
      spec: permit 10.0.2.1/32 le 32
    - addressfamily: ip
      name: vrf104001-in-prefixes
      spec: permit 10.240.0.0/12 le 32
    - addressfamily: ip
      name: vrf104001-in-prefixes
      spec: permit 100.127.131.0/24 le 32
    - addressfamily: ip
      name: vrf104001-in-prefixes
      spec: permit 212.17.234.17/32 le 32
    - addressfamily: ipv6
      name: vrf104001-in6-prefixes
      spec: permit 2001:db8:3::1/128 le 128
    - addressfamily: ipv6
      name: vrf104001-in6-prefixes
      spec: permit fd00:10::/64 le 128
