---
name: leaf01
loglevel: warnings
loopback: 10.0.0.10
asn: 4200000010
metalcorecidr: 10.255.255.2/24
eth0:
  gateway: 192.168.0.254
frrconfig:
  unnumberedinterfaces:
    - name: swp31
    - name: swp32
  bgp:
    - peergroups:
        - name: FABRIC
          commands:
            - remote-as external
            - timers 2 8
        - name: FIREWALL
          commands:
            - remote-as external
            - timers 2 8
      neighbors:
        - name: swp31 interface
          peergroup: FABRIC
        - name: swp32 interface
          peergroup: FABRIC
      addressfamilies:
        - addressfamily: ipv4 unicast
          globalstatements:
            - redistribute connected route-map DENY_MGMT
            - redistribute kernel route-map DENY_MGMT
          neighbors:
            - neighbor: FIREWALL
              commands:
                - allowas-in 2
        - addressfamily: ipv6 unicast
          globalstatements:
            - redistribute connected route-map DENY_MGMT
            - redistribute kernel route-map DENY_MGMT
          neighbors:
            - neighbor: FIREWALL
              commands:
                - allowas-in 2
                - activate
        - addressfamily: l2vpn evpn
          globalstatements:
            - advertise-all-vni
          neighbors:
            - neighbor: FABRIC
              commands:
                - activate
                - allowas-in 2
            - neighbor: FIREWALL
              commands:
                - activate
                - allowas-in 2
